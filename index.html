<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🌿 Woodland Cinema</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cormorant Garamond', serif;
      background: #0d0a08;
      color: #d4c9b8;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== ФОН ===== */
    .bg-forest {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(ellipse at 50% 100%, rgba(34, 60, 30, 0.3) 0%, transparent 70%),
        radial-gradient(ellipse at 30% 50%, rgba(60, 40, 20, 0.2) 0%, transparent 50%),
        #0d0a08;
    }

    .bg-forest::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 10% 20%, rgba(200, 180, 120, 0.03) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(100, 60, 30, 0.05) 0%, transparent 40%);
    }

    /* Лісова листва згори */
    .forest-canopy {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 120px;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(ellipse at 10% 0%, rgba(30, 60, 20, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 0%, rgba(40, 70, 30, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 0%, rgba(30, 60, 20, 0.15) 0%, transparent 60%);
    }

    /* Вогники світлячків (анімація) */
    .fireflies {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .firefly {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 220, 150, 0.6);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255, 220, 150, 0.3);
      animation: float-firefly 8s infinite ease-in-out;
    }

    @keyframes float-firefly {
      0%, 100% { transform: translate(0, 0) scale(0.5); opacity: 0.1; }
      50% { transform: translate(30px, -60px) scale(1); opacity: 0.8; }
    }

    /* ===== ОСНОВНИЙ КОНТЕЙНЕР ===== */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* ===== ХЕДЕР ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0 30px;
      border-bottom: 1px solid rgba(180, 150, 100, 0.1);
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 30% 30%, #5a7a4a, #2a3a1a);
      border: 1px solid rgba(180, 150, 100, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: #d4c9b8;
      box-shadow: 0 0 40px rgba(180, 150, 100, 0.05);
    }

    .logo-text {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #e8dcc8;
      letter-spacing: 3px;
    }

    .logo-text span {
      color: #8a7a5a;
    }

    .logo-sub {
      font-size: 0.55rem;
      color: rgba(180, 150, 100, 0.25);
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: 300;
      margin-top: 2px;
    }

    /* ===== СТАТУС ===== */
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      color: rgba(180, 150, 100, 0.25);
      letter-spacing: 2px;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(180, 150, 100, 0.05);
      font-weight: 300;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #5a7a4a;
      animation: pulse-leaf 3s infinite;
    }

    @keyframes pulse-leaf {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }

    /* ===== ГЕРОЙ ===== */
    .hero {
      text-align: center;
      padding: 50px 20px 30px;
    }

    .hero h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 3.8rem;
      font-weight: 700;
      letter-spacing: 6px;
      color: #e8dcc8;
      text-shadow: 0 0 60px rgba(180, 150, 100, 0.05);
    }

    .hero h1 em {
      font-style: normal;
      color: #8a7a5a;
    }

    .hero p {
      font-size: 1.05rem;
      color: rgba(180, 150, 100, 0.3);
      margin-top: 16px;
      letter-spacing: 4px;
      font-weight: 300;
    }

    .hero .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(180, 150, 100, 0.2), transparent);
      margin: 24px auto 0;
    }

    /* ===== КАРТКИ ===== */
    .card {
      background: rgba(20, 18, 14, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 20px;
      border: 1px solid rgba(180, 150, 100, 0.05);
      transition: all 0.5s ease;
    }

    .card:hover {
      border-color: rgba(180, 150, 100, 0.1);
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }

    .card-label {
      font-size: 0.6rem;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: rgba(180, 150, 100, 0.15);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-label i {
      color: #5a7a4a;
      font-size: 0.7rem;
    }

    /* ===== ІНПУТИ ===== */
    .input-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      padding: 14px 22px;
      font-size: 0.95rem;
      border: 1px solid rgba(180, 150, 100, 0.06);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      color: #d4c9b8;
      transition: all 0.4s;
      font-family: 'Cormorant Garamond', serif;
      min-width: 200px;
      font-weight: 300;
    }

    input:focus {
      outline: none;
      border-color: rgba(180, 150, 100, 0.15);
      background: rgba(255,255,255,0.03);
      box-shadow: 0 0 40px rgba(180, 150, 100, 0.02);
    }

    input::placeholder {
      color: rgba(180, 150, 100, 0.1);
      font-weight: 300;
    }

    /* ===== КНОПКИ ===== */
    .btn {
      padding: 14px 32px;
      font-size: 0.85rem;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.4s;
      font-family: 'Cormorant Garamond', serif;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      letter-spacing: 2px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3a4a2a, #2a3a1a);
      color: #e8dcc8;
      border: 1px solid rgba(180, 150, 100, 0.05);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 40px rgba(40, 60, 30, 0.2);
      border-color: rgba(180, 150, 100, 0.1);
    }

    .btn-outline {
      background: transparent;
      color: rgba(180, 150, 100, 0.2);
      border: 1px solid rgba(180, 150, 100, 0.05);
    }

    .btn-outline:hover {
      border-color: rgba(180, 150, 100, 0.1);
      color: rgba(180, 150, 100, 0.4);
    }

    /* ===== ВІДЕО ===== */
    .video-wrapper {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #0a0806;
      border: 1px solid rgba(180, 150, 100, 0.05);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .video-wrapper::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(180, 150, 100, 0.05), transparent, rgba(180, 150, 100, 0.05));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    video {
      width: 100%;
      display: block;
      background: #0a0806;
    }

    .video-overlay-info {
      position: absolute;
      bottom: 16px;
      left: 20px;
      font-size: 0.5rem;
      color: rgba(180, 150, 100, 0.08);
      letter-spacing: 4px;
      pointer-events: none;
      font-family: 'Cinzel Decorative', serif;
    }

    /* ===== СТАТУС ===== */
    .status-bar {
      margin-top: 16px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(20, 18, 14, 0.3);
      border: 1px solid rgba(180, 150, 100, 0.03);
      transition: all 0.3s;
      font-weight: 300;
    }

    .status-bar .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-bar.success .dot { background: #5a7a4a; }
    .status-bar.error .dot { background: #8a4a3a; }
    .status-bar.warning .dot { background: #8a7a3a; }
    .status-bar.info .dot { background: rgba(180, 150, 100, 0.1); }

    /* ===== ROOM BADGE ===== */
    .room-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 18px;
      border-radius: 20px;
      background: rgba(40, 60, 30, 0.08);
      border: 1px solid rgba(180, 150, 100, 0.05);
      font-size: 0.7rem;
      color: rgba(180, 150, 100, 0.2);
      letter-spacing: 2px;
    }

    /* ===== ТЕСТОВИЙ БЛОК ===== */
    .test-block {
      margin-top: 16px;
      padding: 12px 18px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.65rem;
      color: rgba(180, 150, 100, 0.06);
      font-weight: 300;
      letter-spacing: 2px;
    }

    .test-block code {
      font-family: 'Cormorant Garamond', serif;
      color: rgba(180, 150, 100, 0.08);
    }

    /* ===== ФУТЕР ===== */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 0 20px;
      margin-top: 40px;
      border-top: 1px solid rgba(180, 150, 100, 0.03);
      font-size: 0.65rem;
      color: rgba(180, 150, 100, 0.06);
      letter-spacing: 3px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .footer a {
      color: rgba(180, 150, 100, 0.08);
      text-decoration: none;
      transition: 0.3s;
    }

    .footer a:hover {
      color: rgba(180, 150, 100, 0.2);
    }

    .footer .social {
      display: flex;
      gap: 20px;
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 768px) {
      .hero h1 { font-size: 2.2rem; letter-spacing: 4px; }
      .header { flex-direction: column; align-items: flex-start; }
      .logo-text { font-size: 1.2rem; }
      .input-group { flex-direction: column; }
      .btn { justify-content: center; }
      .card { padding: 20px; }
      .footer { flex-direction: column; text-align: center; }
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: 1.8rem; }
      .logo-icon { width: 40px; height: 40px; font-size: 1rem; }
    }
  </style>
</head>
<body>

<!-- ===== ФОН ===== -->
<div class="bg-forest"></div>
<div class="forest-canopy"></div>

<!-- ===== СВІТЛЯЧКИ ===== -->
<div class="fireflies" id="fireflies"></div>

<!-- ===== ОСНОВНИЙ КОНТЕЙНЕР ===== -->
<div class="container">

  <!-- ===== ХЕДЕР ===== -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-leaf"></i></div>
      <div>
        <div class="logo-text">Woodland <span>Cinema</span></div>
        <div class="logo-sub">✦ among the ancient trees</div>
      </div>
    </div>
    <div class="status-indicator">
      <span class="status-dot"></span>
      <span>the forest hears</span>
    </div>
  </header>

  <!-- ===== ГЕРОЙ ===== -->
  <div class="hero">
    <h1>watch <em>together</em></h1>
    <p>gather beneath the canopy & share the stories of the silver screen</p>
    <div class="divider"></div>
  </div>

  <!-- ===== КІМНАТА ===== -->
  <div class="card">
    <div class="card-label">
      <i class="fas fa-door-open"></i> the gathering
    </div>
    <div class="input-group">
      <input type="text" id="room" placeholder="name of the glade">
      <button class="btn btn-primary" onclick="joinRoom()">
        <i class="fas fa-sign-in-alt"></i> enter
      </button>
    </div>
    <div id="roomDisplay" class="room-badge" style="display: none;"></div>
  </div>

  <!-- ===== ВІДЕО ===== -->
  <div class="card">
    <div class="card-label">
      <i class="fas fa-link"></i> the tale
    </div>
    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="path to the .mp4">
      <button class="btn btn-primary" onclick="setVideo()">
        <i class="fas fa-play"></i> unfold
      </button>
    </div>
  </div>

  <!-- ===== ПЛЕЄР ===== -->
  <div class="video-wrapper">
    <video id="video" controls></video>
    <div class="video-overlay-info">✦ now unfolding</div>
  </div>

  <!-- ===== СТАТУС ===== -->
  <div id="status" class="status-bar info">
    <span class="dot"></span>
    <span>awaiting the story</span>
  </div>

  <!-- ===== ТЕСТОВИЙ БЛОК ===== -->
  <div class="test-block">
    <i class="fas fa-flask" style="margin-right: 6px;"></i>
    test: <code>https://www.w3schools.com/html/mov_bbb.mp4</code>
  </div>

  <!-- ===== ФУТЕР ===== -->
  <footer class="footer">
    <span>✦ in the heart of the forest</span>
    <div class="social">
      <a href="#">whispers</a>
      <a href="#">legends</a>
    </div>
  </footer>
</div>

<!-- ===== FIREBASE ===== -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// ===== СВІТЛЯЧКИ =====
function createFireflies() {
  const container = document.getElementById('fireflies');
  for (let i = 0; i < 30; i++) {
    const firefly = document.createElement('div');
    firefly.className = 'firefly';
    firefly.style.left = Math.random() * 100 + '%';
    firefly.style.top = Math.random() * 100 + '%';
    firefly.style.animationDelay = Math.random() * 8 + 's';
    firefly.style.animationDuration = 6 + Math.random() * 6 + 's';
    firefly.style.width = (2 + Math.random() * 3) + 'px';
    firefly.style.height = firefly.style.width;
    container.appendChild(firefly);
  }
}
createFireflies();

// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyDEqsA1VXrjLyTixw-urcIyhco_x56kVtw",
  authDomain: "watch2-7672f.firebaseapp.com",
  databaseURL: "https://watch2-7672f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "watch2-7672f",
  storageBucket: "watch2-7672f.firebasestorage.app",
  messagingSenderId: "535788651838",
  appId: "1:535788651838:web:a77c7989426e4697a1586f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomRef = null;
let isUpdating = false;
const video = document.getElementById("video");
const statusEl = document.getElementById("status");

function updateStatus(message, type = "info") {
  const dotColors = {
    success: '#5a7a4a',
    error: '#8a4a3a',
    warning: '#8a7a3a',
    info: 'rgba(180, 150, 100, 0.1)'
  };
  statusEl.innerHTML = `<span class="dot" style="background:${dotColors[type] || dotColors.info};"></span><span>${message}</span>`;
  statusEl.className = `status-bar ${type}`;
  console.log(`[${type}] ${message}`);
}

window.joinRoom = function() {
  const room = document.getElementById("room").value.trim();
  if (!room) {
    updateStatus("a glade must have a name...", "error");
    return;
  }
  
  if (roomRef) roomRef.off();
  
  roomRef = db.ref("rooms/" + room);
  
  roomRef.on("value", (snapshot) => {
    const data = snapshot.val();
    console.log("Отримано:", data);
    
    if (!data) {
      updateStatus(`the glade "${room}" awaits a tale`, "warning");
      return;
    }
    
    updateStatus(`gathered in: ${room}`, "success");
    document.getElementById("roomDisplay").style.display = "inline-block";
    document.getElementById("roomDisplay").innerHTML = `<i class="fas fa-leaf"></i> ${room}`;
    isUpdating = true;
    
    if (data.video && video.src !== data.video) {
      video.src = data.video;
      video.load();
      updateStatus("the story unfolds", "success");
    }
    
    if (data.time !== undefined && Math.abs(video.currentTime - data.time) > 1) {
      video.currentTime = data.time;
    }
    
    if (data.playing) {
      video.play().catch(() => updateStatus("touch the story to begin", "warning"));
    } else {
      video.pause();
    }
    
    isUpdating = false;
  });
  
  updateStatus(`entered the glade "${room}"`, "success");
};

window.setVideo = function() {
  if (!roomRef) {
    updateStatus("first, enter a glade", "error");
    return;
  }
  
  const url = document.getElementById("videoUrl").value.trim();
  if (!url) {
    updateStatus("a tale must be chosen", "error");
    return;
  }
  
  updateStatus("sharing the tale...", "info");
  
  roomRef.set({
    video: url,
    time: 0,
    playing: false
  }).then(() => {
    updateStatus("the tale has been shared!", "success");
  }).catch((error) => {
    updateStatus(`error: ${error.message}`, "error");
  });
};

video.addEventListener("play", () => {
  if (roomRef && !isUpdating) {
    roomRef.update({ playing: true, time: video.currentTime });
  }
});

video.addEventListener("pause", () => {
  if (roomRef && !isUpdating) {
    roomRef.update({ playing: false, time: video.currentTime });
  }
});

video.addEventListener("seeked", () => {
  if (roomRef && !isUpdating) {
    roomRef.update({ time: video.currentTime });
  }
});

updateStatus("the forest is listening...", "info");
</script>

</body>
</html>
