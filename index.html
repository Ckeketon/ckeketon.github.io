<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Watch Party</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* Анімований фон */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(229, 9, 20, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(155, 89, 182, 0.08) 0%, transparent 50%),
        #0a0a0f;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 40px 20px 30px;
      margin-bottom: 40px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .header h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 0%, #e50914 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      color: rgba(255,255,255,0.4);
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .header .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 14px;
      border-radius: 20px;
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid rgba(229, 9, 20, 0.2);
      font-size: 0.7rem;
      color: #e50914;
      letter-spacing: 1px;
    }

    /* Cards */
    .card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 28px 30px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: border-color 0.3s;
    }

    .card:hover {
      border-color: rgba(255,255,255,0.12);
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title i {
      color: #e50914;
      font-size: 0.9rem;
    }

    /* Inputs */
    .input-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      padding: 14px 20px;
      font-size: 0.95rem;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      color: #e0e0e0;
      transition: all 0.3s;
      font-family: 'Space Grotesk', sans-serif;
      min-width: 200px;
    }

    input:focus {
      outline: none;
      border-color: #e50914;
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0 25px rgba(229, 9, 20, 0.05);
    }

    input::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .btn {
      padding: 14px 28px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Space Grotesk', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #e50914, #b20710);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(229, 9, 20, 0.3);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #e0e0e0;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
    }

    /* Video */
    .video-wrapper {
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    video {
      width: 100%;
      display: block;
      background: #000;
    }

    /* Status */
    .status {
      margin-top: 16px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .status i {
      font-size: 0.9rem;
    }

    .status.success { color: #4caf50; border-color: rgba(76,175,80,0.15); }
    .status.error { color: #f44336; border-color: rgba(244,67,54,0.15); }
    .status.warning { color: #ff9800; border-color: rgba(255,152,0,0.15); }
    .status.info { color: rgba(255,255,255,0.5); }

    /* Room Badge */
    .room-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(229, 9, 20, 0.12);
      border: 1px solid rgba(229, 9, 20, 0.15);
      font-size: 0.8rem;
      color: #e50914;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 40px 20px 20px;
      border-top: 1px solid rgba(255,255,255,0.04);
      margin-top: 40px;
      color: rgba(255,255,255,0.2);
      font-size: 0.75rem;
      letter-spacing: 1px;
    }

    .footer a {
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      transition: 0.3s;
    }

    .footer a:hover {
      color: rgba(255,255,255,0.6);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header h1 { font-size: 2.2rem; }
      .input-group { flex-direction: column; }
      .btn { justify-content: center; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="bg-gradient"></div>

<div class="container">
  <div class="header">
    <h1>watch party</h1>
    <p>спільний перегляд фільмів та серіалів</p>
    <div class="badge">✦ realtime sync</div>
  </div>

  <div class="card">
    <div class="card-title">
      <i class="fas fa-door-open"></i>
      <span>Кімната</span>
    </div>
    <div class="input-group">
      <input type="text" id="room" placeholder="назва кімнати (наприклад: anime-night)">
      <button class="btn btn-primary" onclick="joinRoom()">
        <i class="fas fa-sign-in-alt"></i> Join
      </button>
    </div>
    <div id="roomDisplay" class="room-badge" style="display: none;"></div>
  </div>

  <div class="card">
    <div class="card-title">
      <i class="fas fa-link"></i>
      <span>Відео</span>
    </div>
    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="посилання на .mp4 відео">
      <button class="btn btn-primary" onclick="setVideo()">
        <i class="fas fa-play"></i> Load
      </button>
    </div>
  </div>

  <div class="video-wrapper">
    <video id="video" controls></video>
  </div>

  <div id="status" class="status info">
    <i class="fas fa-circle" style="font-size: 0.5rem;"></i>
    <span>готовий до роботи</span>
  </div>

  <div style="margin-top: 20px; padding: 16px 20px; border-radius: 14px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); text-align: center; font-size: 0.8rem; color: rgba(255,255,255,0.3);">
    <i class="fas fa-users" style="margin-right: 6px;"></i>
    1️⃣ Введіть кімнату → Join &nbsp;·&nbsp;
    <i class="fas fa-video" style="margin-right: 6px;"></i>
    2️⃣ Вставте .mp4 → Load &nbsp;·&nbsp;
    <i class="fas fa-share-alt" style="margin-right: 6px;"></i>
    3️⃣ Дайте другу URL
    <br><br>
    <span style="font-size: 0.7rem; color: rgba(255,255,255,0.15);">
      тестове: https://www.w3schools.com/html/mov_bbb.mp4
    </span>
  </div>

  <div class="footer">
    <a href="https://github.com/ckeketon" target="_blank">github</a> &nbsp;·&nbsp; watch party
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDEqsA1VXrjLyTixw-urcIyhco_x56kVtw",
  authDomain: "watch2-7672f.firebaseapp.com",
  databaseURL: "https://watch2-7672f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "watch2-7672f",
  storageBucket: "watch2-7672f.firebasestorage.app",
  messagingSenderId: "535788651838",
  appId: "1:535788651838:web:a77c7989426e4697a1586f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomRef = null;
let isUpdating = false;
const video = document.getElementById("video");
const statusDiv = document.getElementById("status");
const roomDisplay = document.getElementById("roomDisplay");

function updateStatus(message, type = "info") {
  statusDiv.innerHTML = `<i class="fas fa-circle" style="font-size: 0.5rem;"></i><span>${message}</span>`;
  statusDiv.className = `status ${type}`;
  console.log(`[${type}] ${message}`);
}

window.joinRoom = function() {
  const room = document.getElementById("room").value.trim();
  if (!room) {
    updateStatus("введіть назву кімнати!", "error");
    return;
  }
  
  if (roomRef) roomRef.off();
  
  roomRef = db.ref("rooms/" + room);
  
  roomRef.on("value", (snapshot) => {
    const data = snapshot.val();
    console.log("Отримано:", data);
    
    if (!data) {
      updateStatus(`кімната "${room}" порожня. завантажте відео.`, "warning");
      return;
    }
    
    updateStatus(`в кімнаті: ${room}`, "success");
    roomDisplay.style.display = "inline-block";
    roomDisplay.innerHTML = `<i class="fas fa-hashtag"></i> ${room}`;
    isUpdating = true;
    
    if (data.video && video.src !== data.video) {
      video.src = data.video;
      video.load();
      updateStatus("відео завантажено", "success");
    }
    
    if (data.time !== undefined && Math.abs(video.currentTime - data.time) > 1) {
      video.currentTime = data.time;
    }
    
    if (data.playing) {
      video.play().catch(() => updateStatus("натисніть Play на відео", "warning"));
    } else {
      video.pause();
    }
    
    isUpdating = false;
  });
  
  updateStatus(`приєднано до "${room}"`, "success");
};

window.setVideo = function() {
  if (!roomRef) {
    updateStatus("спочатку натисніть Join!", "error");
    return;
  }
  
  const url = document.getElementById("videoUrl").value.trim();
  if (!url) {
    updateStatus("вставте посилання на відео!", "error");
    return;
  }
  
  updateStatus("відправка...", "info");
  
  roomRef.set({
    video: url,
    time: 0,
    playing: false
  }).then(() => {
    updateStatus("відео відправлено!", "success");
  }).catch((error) => {
    updateStatus(`помилка: ${error.message}`, "error");
  });
};

video.addEventListener("play", () => {
  if (roomRef && !isUpdating) {
    roomRef.update({ playing: true, time: video.currentTime });
  }
});

video.addEventListener("pause", () => {
  if (roomRef && !isUpdating) {
    roomRef.update({ playing: false, time: video.currentTime });
  }
});

video.addEventListener("seeked", () => {
  if (roomRef && !isUpdating) {
    roomRef.update({ time: video.currentTime });
  }
});

updateStatus("готовий до роботи", "info");
</script>

</body>
</html>
