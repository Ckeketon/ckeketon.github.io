<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 YouTube MP3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 40px;
      max-width: 700px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #fff, #9b59b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
    }
    .subtitle {
      color: rgba(255,255,255,0.5);
      margin-bottom: 30px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .input-group input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
      outline: none;
    }
    .input-group input:focus {
      border-color: #9b59b6;
    }
    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #9b59b6, #e74c3c);
      color: white;
    }
    .btn:hover {
      transform: scale(1.02);
    }
    #player {
      margin-top: 20px;
      display: none;
    }
    iframe {
      width: 100%;
      height: 200px;
      border-radius: 15px;
      border: none;
    }
    .back-link {
      display: block;
      margin-top: 25px;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
    }
    .back-link:hover {
      color: rgba(255,255,255,0.7);
    }
    .info-box {
      background: rgba(155,89,182,0.1);
      border: 1px solid #9b59b6;
      padding: 12px;
      border-radius: 10px;
      margin: 15px 0;
      font-size: 0.85rem;
      color: #b380c9;
    }
    .info-box a {
      color: #b380c9;
    }
    @media (max-width: 480px) {
      .input-group { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎵 YouTube MP3</h1>
  <p class="subtitle">Вставте посилання та слухайте онлайн</p>

  <div class="input-group">
    <input type="text" id="youtubeUrl" placeholder="https://youtube.com/watch?v=...">
    <button class="btn" id="playBtn">▶ Відтворити</button>
  </div>

  <div class="info-box">
    💡 Для скачування MP3 використовуйте:<br>
    <a href="https://y2mate.is/" target="_blank">y2mate.is</a> або 
    <a href="https://loader.to/" target="_blank">loader.to</a>
  </div>

  <div id="player">
    <iframe id="youtubeIframe" allow="encrypted-media" allowfullscreen></iframe>
  </div>

  <a href="index.html" class="back-link">← Повернутись до Watch Party</a>
</div>

<script>
  function getYoutubeId(url) {
    url = url.replace('music.youtube.com', 'youtube.com');
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([^&]+)/,
      /(?:youtu\.be\/)([^?]+)/
    ];
    for (const pattern of patterns) {
      const match = url.match(pattern);
      if (match) return match[1];
    }
    return null;
  }

  function playVideo() {
    const url = document.getElementById('youtubeUrl').value.trim();
    const videoId = getYoutubeId(url);
    
    if (!videoId) {
      alert('Невірне посилання на YouTube');
      return;
    }

    const player = document.getElementById('player');
    const iframe = document.getElementById('youtubeIframe');
    
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    player.style.display = 'block';
  }

  document.getElementById('playBtn').addEventListener('click', playVideo);
  document.getElementById('youtubeUrl').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') playVideo();
  });
</script>

</body>
</html>
