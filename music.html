<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 YouTube MP3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 40px;
      max-width: 700px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #fff, #9b59b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 5px;
    }
    .subtitle {
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      margin-bottom: 25px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .input-group input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
      outline: none;
      min-width: 200px;
    }
    .input-group input:focus {
      border-color: #9b59b6;
    }
    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #9b59b6, #e74c3c);
      color: white;
    }
    .btn-primary:hover {
      transform: scale(1.03);
      box-shadow: 0 5px 20px rgba(155,89,182,0.4);
    }
    .btn-success {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: white;
    }
    .btn-success:hover {
      transform: scale(1.03);
      box-shadow: 0 5px 20px rgba(46,204,113,0.4);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: 0.3s;
    }
    .tab-btn.active {
      background: rgba(155,89,182,0.25);
      border-color: #9b59b6;
      color: white;
    }
    #player { display: none; margin-top: 15px; }
    #player iframe { width: 100%; height: 200px; border-radius: 15px; border: none; }
    .download-section {
      display: none;
      margin-top: 15px;
      padding: 20px;
      background: rgba(46,204,113,0.08);
      border: 1px solid #2ecc71;
      border-radius: 15px;
    }
    .loader {
      display: none;
      margin: 15px 0;
    }
    .loader-spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #9b59b6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem;
      margin-top: 8px;
    }
    .status-message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: none;
    }
    .status-message.show { display: block; }
    .status-message.success { background: rgba(46,204,113,0.15); border: 1px solid #2ecc71; color: #2ecc71; }
    .status-message.error { background: rgba(231,76,60,0.15); border: 1px solid #e74c3c; color: #e74c3c; }
    .status-message.info { background: rgba(241,196,15,0.15); border: 1px solid #f1c40f; color: #f1c40f; }
    .back-link {
      display: block;
      margin-top: 25px;
      color: rgba(255,255,255,0.2);
      text-decoration: none;
      transition: 0.3s;
    }
    .back-link:hover { color: rgba(255,255,255,0.6); }
    .info-box {
      background: rgba(155,89,182,0.08);
      border: 1px solid rgba(155,89,182,0.2);
      padding: 12px 16px;
      border-radius: 10px;
      margin: 15px 0;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
    }
    @media (max-width: 480px) {
      .container { padding: 25px; }
      .input-group { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎵 YouTube MP3</h1>
  <p class="subtitle">Вставте посилання, слухайте та скачуйте</p>

  <div class="input-group">
    <input type="text" id="youtubeUrl" placeholder="https://youtube.com/watch?v=..." value="https://youtu.be/tMx3V5iVTnw">
    <button class="btn btn-primary" id="loadBtn">▶ Завантажити</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="player">🎵 Плеєр</button>
    <button class="tab-btn" data-tab="download">⬇️ Скачати MP3</button>
  </div>

  <div id="player">
    <iframe id="youtubeIframe" allow="encrypted-media" allowfullscreen></iframe>
  </div>

  <div id="downloadSection" class="download-section">
    <h3>⬇️ Завантажити MP3</h3>
    <div class="loader" id="loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">⏳ Конвертація... (може зайняти 20-30 секунд)</div>
    </div>
    <button class="btn btn-success" id="downloadBtn" style="width:100%;">🔊 Конвертувати та скачати</button>
    <div class="status-message" id="statusMessage"></div>
  </div>

  <div class="info-box">
    💡 <strong>Ваш власний сервер для конвертації YouTube → MP3!</strong><br>
    Перший запит може бути повільним (сервер "прокидається").
  </div>

  <a href="index.html" class="back-link">← Повернутись до Watch Party</a>
</div>

<script>
  // ===== ВАШ СЕРВЕР НА RENDER =====
  const SERVER_URL = 'https://youtube-mp3-api-delk.onrender.com/download';

  function getYoutubeId(url) {
    if (!url) return null;
    url = url.replace('music.youtube.com', 'youtube.com');
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([^&]+)/,
      /(?:youtu\.be\/)([^?]+)/,
      /(?:youtube\.com\/embed\/)([^?]+)/
    ];
    for (const pattern of patterns) {
      const match = url.match(pattern);
      if (match) return match[1];
    }
    return null;
  }

  function loadVideo() {
    const url = document.getElementById('youtubeUrl').value.trim();
    const videoId = getYoutubeId(url);
    if (!videoId) {
      showStatus('❌ Невірне посилання на YouTube', 'error');
      return;
    }
    const iframe = document.getElementById('youtubeIframe');
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
    document.getElementById('player').style.display = 'block';
    document.getElementById('downloadSection').style.display = 'block';
    showStatus('✅ Відео завантажено в плеєр', 'success');
  }

  async function downloadMP3() {
    const url = document.getElementById('youtubeUrl').value.trim();
    const videoId = getYoutubeId(url);
    if (!videoId) {
      showStatus('❌ Невірне посилання на YouTube', 'error');
      return;
    }

    const btn = document.getElementById('downloadBtn');
    const loader = document.getElementById('loader');
    btn.disabled = true;
    loader.style.display = 'block';
    showStatus('⏳ Конвертація... сервер може "прокидатись" до 30 секунд', 'info');

    try {
      const response = await fetch(`${SERVER_URL}?url=https://youtu.be/${videoId}`);
      
      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || 'Помилка конвертації');
      }

      const blob = await response.blob();
      const downloadUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = 'audio.mp3';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(downloadUrl), 5000);
      showStatus('✅ MP3 успішно завантажено!', 'success');
    } catch (error) {
      showStatus(`❌ ${error.message || 'Помилка'}`, 'error');
    } finally {
      btn.disabled = false;
      loader.style.display = 'none';
    }
  }

  function showStatus(message, type) {
    const el = document.getElementById('statusMessage');
    el.textContent = message;
    el.className = `status-message show ${type}`;
  }

  // ===== ТАБИ =====
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      if (this.dataset.tab === 'player') {
        document.getElementById('player').style.display = 'block';
        document.getElementById('downloadSection').style.display = 'none';
      } else {
        document.getElementById('player').style.display = 'none';
        document.getElementById('downloadSection').style.display = 'block';
      }
    });
  });

  document.getElementById('loadBtn').addEventListener('click', loadVideo);
  document.getElementById('downloadBtn').addEventListener('click', downloadMP3);
  document.getElementById('youtubeUrl').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') loadVideo();
  });

  window.onload = function() { setTimeout(loadVideo, 300); };
</script>

</body>
</html>
