<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎬 Cinema Night</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== ФОН ===== */
    .bg-scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: 
        radial-gradient(ellipse at 50% 80%, rgba(229, 9, 20, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 20% 20%, rgba(155, 89, 182, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 150, 255, 0.06) 0%, transparent 50%),
        #0a0a0a;
    }

    .bg-scene .grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .bg-scene .scanline {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 3px,
        rgba(255,255,255,0.01) 3px,
        rgba(255,255,255,0.01) 4px
      );
      pointer-events: none;
    }

    /* ===== ОСНОВНИЙ КОНТЕЙНЕР ===== */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ===== ХЕДЕР ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0 30px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #e50914, #b20710);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 0 40px rgba(229, 9, 20, 0.2);
    }

    .logo-text {
      font-family: 'Orbitron', monospace;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 0%, #e50914 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .logo-sub {
      font-size: 0.55rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 400;
      margin-top: 2px;
    }

    /* ===== СТАТУС-ІНДИКАТОР ===== */
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1px;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4caf50;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ===== ГЕРОЙ ===== */
    .hero {
      text-align: center;
      padding: 60px 20px 40px;
    }

    .hero h1 {
      font-family: 'Orbitron', monospace;
      font-size: 4.5rem;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1.1;
      background: linear-gradient(135deg, #ffffff 0%, #e50914 40%, #9b59b6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      font-size: 1rem;
      color: rgba(255,255,255,0.3);
      margin-top: 16px;
      letter-spacing: 2px;
      font-weight: 300;
    }

    .hero .glow-line {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e50914, transparent);
      margin: 20px auto 0;
    }

    /* ===== КАРТКИ ===== */
    .card {
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 28px 32px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.4s ease;
    }

    .card:hover {
      border-color: rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
    }

    .card-label {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.15);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-label i {
      color: #e50914;
      font-size: 0.7rem;
    }

    /* ===== ІНПУТИ ===== */
    .input-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      padding: 16px 22px;
      font-size: 0.95rem;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      color: #e0e0e0;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      min-width: 200px;
    }

    input:focus {
      outline: none;
      border-color: #e50914;
      background: rgba(255,255,255,0.05);
      box-shadow: 0 0 30px rgba(229, 9, 20, 0.05);
    }

    input::placeholder {
      color: rgba(255,255,255,0.15);
    }

    /* ===== КНОПКИ ===== */
    .btn {
      padding: 16px 32px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #e50914, #b20710);
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 40px rgba(229, 9, 20, 0.25);
    }

    .btn-outline {
      background: transparent;
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .btn-outline:hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.15);
    }

    /* ===== ВІДЕО ===== */
    .video-wrapper {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .video-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(229,9,20,0.1), transparent, rgba(155,89,182,0.1));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    video {
      width: 100%;
      display: block;
      background: #000;
    }

    .video-overlay-info {
      position: absolute;
      bottom: 16px;
      left: 20px;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.15);
      letter-spacing: 2px;
      pointer-events: none;
      font-family: 'Orbitron', monospace;
    }

    /* ===== СТАТУС ===== */
    .status-bar {
      margin-top: 16px;
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.3s;
    }

    .status-bar .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-bar.success .dot { background: #4caf50; }
    .status-bar.error .dot { background: #f44336; }
    .status-bar.warning .dot { background: #ff9800; }
    .status-bar.info .dot { background: rgba(255,255,255,0.2); }

    /* ===== ROOM BADGE ===== */
    .room-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 18px;
      border-radius: 20px;
      background: rgba(229, 9, 20, 0.08);
      border: 1px solid rgba(229, 9, 20, 0.1);
      font-size: 0.75rem;
      color: #e50914;
      letter-spacing: 0.5px;
    }

    /* ===== ФУТЕР ===== */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 0 20px;
      margin-top: 40px;
      border-top: 1px solid rgba(255,255,255,0.03);
      font-size: 0.7rem;
      color: rgba(255,255,255,0.12);
      letter-spacing: 1px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .footer a {
      color: rgba(255,255,255,0.2);
      text-decoration: none;
      transition: 0.3s;
    }

    .footer a:hover {
      color: rgba(255,255,255,0.5);
    }

    .footer .social {
      display: flex;
      gap: 20px;
    }

    /* ===== ТЕСТОВИЙ БЛОК ===== */
    .test-block {
      margin-top: 16px;
      padding: 12px 18px;
      border-radius: 14px;
      background: rgba(255,255,255,0.01);
      border: 1px dashed rgba(255,255,255,0.04);
      text-align: center;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.12);
      transition: 0.3s;
    }

    .test-block:hover {
      border-color: rgba(255,255,255,0.08);
    }

    .test-block code {
      background: rgba(255,255,255,0.03);
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.2);
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 768px) {
      .hero h1 { font-size: 2.5rem; }
      .header { flex-direction: column; align-items: flex-start; }
      .logo-text { font-size: 1.4rem; }
      .input-group { flex-direction: column; }
      .btn { justify-content: center; }
      .card { padding: 20px; }
      .footer { flex-direction: column; text-align: center; }
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: 2rem; }
      .logo-icon { width: 40px; height: 40px; font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<!-- ===== ФОН ===== -->
<div class="bg-scene">
  <div class="grid"></div>
  <div class="scanline"></div>
</div>

<!-- ===== ОСНОВНИЙ КОНТЕЙНЕР ===== -->
<div class="container">

  <!-- ===== ХЕДЕР ===== -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-play"></i></div>
      <div>
        <div class="logo-text">CINEMA NIGHT</div>
        <div class="logo-sub">✦ realtime sync</div>
      </div>
    </div>
    <div class="status-indicator">
      <span class="status-dot"></span>
      <span>online</span>
    </div>
  </header>

  <!-- ===== ГЕРОЙ ===== -->
  <div class="hero">
    <h1>watch together</h1>
    <p>створіть кімнату та дивіться фільми з друзями в реальному часі</p>
    <div class="glow-line"></div>
  </div>

  <!-- ===== КІМНАТА ===== -->
  <div class="card">
    <div class="card-label">
      <i class="fas fa-door-open"></i> кімната
    </div>
    <div class="input-group">
      <input type="text" id="room" placeholder="назва кімнати">
      <button class="btn btn-primary" onclick="joinRoom()">
        <i class="fas fa-sign-in-alt"></i> join
      </button>
    </div>
    <div id="roomDisplay" class="room-badge" style="display: none;"></div>
  </div>

  <!-- ===== ВІДЕО ===== -->
  <div class="card">
    <div class="card-label">
      <i class="fas fa-link"></i> джерело
    </div>
    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="посилання на .mp4 відео">
      <button class="btn btn-primary" onclick="setVideo()">
        <i class="fas fa-play"></i> load
      </button>
    </div>
  </div>

  <!-- ===== ПЛЕЄР ===== -->
  <div class="video-wrapper">
    <video id="video" controls></video>
    <div class="video-overlay-info">◆ now playing</div>
  </div>

  <!-- ===== СТАТУС ===== -->
  <div id="status" class="status-bar info">
    <span class="dot"></span>
    <span>готовий до роботи</span>
  </div>

  <!-- ===== ТЕСТОВИЙ БЛОК ===== -->
  <div class="test-block">
    <i class="fas fa-flask" style="margin-right: 6px;"></i>
    тестове відео: <code>https://www.w3schools.com/html/mov_bbb.mp4</code>
  </div>

  <!-- ===== ФУТЕР ===== -->
  <footer class="footer">
    <span>© 2024 cinema night</span>
    <div class="social">
      <a href="#">github</a>
      <a href="#">about</a>
    </div>
  </footer>
</div>

<!-- ===== FIREBASE ===== -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyDEqsA1VXrjLyTixw-urcIyhco_x56kVtw",
  authDomain: "watch2-7672f.firebaseapp.com",
  databaseURL: "https://watch2-7672f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "watch2-7672f",
  storageBucket: "watch2-7672f.firebasestorage.app",
  messagingSenderId: "535788651838",
  appId: "1:535788651838:web:a77c7989426e4697a1586f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomRef = null;
let isUpdating = false;
const video = document.getElementById("video");
const statusEl = document.getElementById("status");

function updateStatus(message, type = "info") {
  const dotColors = {
    success: '#4caf50',
    error: '#f44336',
    warning: '#ff9800',
    info: 'rgba(255,255,255,0.2)'
  };
  statusEl.innerHTML = `<span class="dot" style="background:${dotColors[type] || dotColors.info};"></span><span>${message}</span>`;
  statusEl.className = `status-bar ${type}`;
  console.log(`[${type}] ${message}`);
}

window.joinRoom = function() {
  const room = document.getElementById("room").value.trim();
  if (!room) {
    updateStatus("введіть назву кімнати!", "error");
    return;
  }
  
  if (roomRef) roomRef.off();
  
  roomRef = db.ref("rooms/" + room);
  
  roomRef.on("value", (snapshot) => {
    const data = snapshot.val();
    console.log("Отримано:", data);
    
    if (!data) {
      updateStatus(`кімната "${room}" порожня. завантажте відео.`, "warning");
      return;
    }
    
    updateStatus(`в кімнаті: ${room}`, "success");
    document.getElementById("roomDisplay").style.display = "inline-block";
    document.getElementById("roomDisplay").innerHTML = `<i class="fas fa-hashtag"></i> ${room}`;
    isUpdating = true;
    
    if (data.video && video.src !== data.video) {
      video.src = data.video;
      video.load();
      updateStatus("відео завантажено", "success");
    }
    
    if (data.time !== undefined && Math.abs(video.currentTime - data.time) > 1) {
      video.currentTime = data.time;
    }
    
    if (data.playing) {
      video.play().catch(() => updateStatus("натисніть Play на відео", "warning"));
    } else {
      video.pause();
    }
    
    isUpdating = false;
  });
  
  updateStatus(`приєднано до "${room}"`, "success");
};

window.setVideo = function() {
  if (!roomRef) {
    updateStatus("спочатку натисніть Join!", "error");
    return;
  }
  
  const url = document.getElementById("videoUrl").value.trim();
  if (!url) {
    updateStatus("вставте посилання на відео!", "error");
    return;
  }
  
  updateStatus("відправка...", "info");
  
  roomRef.set({
    video: url,
    time: 0,
    playing: false
  }).then(() => {
    updateStatus("відео відправлено!", "success");
  }).catch((error) => {
    updateStatus(`помилка: ${error.message}`, "error");
  });
};

video.addEventListener("play", () => {
  if (roomRef && !isUpdating) {
    roomRef.update({ playing: true, time: video.currentTime });
  }
});

video.addEventListener("pause", () => {
  if (roomRef && !isUpdating) {
    roomRef.update({ playing: false, time: video.currentTime });
  }
});

video.addEventListener("seeked", () => {
  if (roomRef && !isUpdating) {
    roomRef.update({ time: video.currentTime });
  }
});

updateStatus("готовий до роботи", "info");
</script>

</body>
</html>
