<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 YouTube MP3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 40px;
      max-width: 700px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #fff, #9b59b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 5px;
    }
    .subtitle {
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      margin-bottom: 25px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .input-group input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
      outline: none;
    }
    .input-group input:focus {
      border-color: #9b59b6;
    }
    .input-group input::placeholder {
      color: rgba(255,255,255,0.3);
    }
    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #9b59b6, #e74c3c);
      color: white;
      transition: 0.3s;
    }
    .btn:hover {
      transform: scale(1.03);
      box-shadow: 0 5px 20px rgba(155,89,182,0.4);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: 0.3s;
    }
    .tab-btn.active {
      background: rgba(155,89,182,0.25);
      border-color: #9b59b6;
      color: white;
    }
    #player {
      display: none;
      margin-top: 15px;
    }
    #player iframe {
      width: 100%;
      height: 200px;
      border-radius: 15px;
      border: none;
    }
    .download-section {
      display: none;
      margin-top: 15px;
      padding: 20px;
      background: rgba(46,204,113,0.08);
      border: 1px solid #2ecc71;
      border-radius: 15px;
    }
    .download-section h3 {
      color: #2ecc71;
      font-size: 1rem;
      margin-bottom: 15px;
    }
    .download-btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .download-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 5px 20px rgba(46,204,113,0.4);
    }
    .download-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .loader {
      display: none;
      margin: 15px 0;
    }
    .loader-spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #9b59b6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem;
      margin-top: 8px;
    }
    .info-box {
      background: rgba(155,89,182,0.08);
      border: 1px solid rgba(155,89,182,0.2);
      padding: 12px 16px;
      border-radius: 10px;
      margin: 15px 0;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
    }
    .info-box strong {
      color: #b380c9;
    }
    .back-link {
      display: block;
      margin-top: 25px;
      color: rgba(255,255,255,0.2);
      text-decoration: none;
      transition: 0.3s;
    }
    .back-link:hover {
      color: rgba(255,255,255,0.6);
    }
    .status-message {
      margin-top: 10px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
    }
    .status-message.success {
      color: #2ecc71;
    }
    .status-message.error {
      color: #e74c3c;
    }
    @media (max-width: 480px) {
      .container { padding: 25px; }
      .input-group { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎵 YouTube MP3</h1>
  <p class="subtitle">Вставте посилання, слухайте та скачуйте</p>

  <div class="input-group">
    <input type="text" id="youtubeUrl" placeholder="https://youtube.com/watch?v=..." value="https://youtu.be/tMx3V5iVTnw">
    <button class="btn" id="loadBtn">▶ Завантажити</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="player">🎵 Плеєр</button>
    <button class="tab-btn" data-tab="download">⬇️ Скачати MP3</button>
  </div>

  <div id="player">
    <iframe id="youtubeIframe" allow="encrypted-media" allowfullscreen></iframe>
  </div>

  <div id="downloadSection" class="download-section">
    <h3>⬇️ Завантажити MP3</h3>
    <div class="loader" id="loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">⏳ Конвертація...</div>
    </div>
    <button class="download-btn" id="downloadBtn">🔊 Конвертувати та скачати</button>
    <div class="status-message" id="statusMessage"></div>
  </div>

  <div class="info-box">
    💡 <strong>Порада:</strong> Для скачування MP3 перейдіть на вкладку <strong>"Скачати MP3"</strong> та натисніть кнопку. Файл завантажиться автоматично.
  </div>

  <a href="index.html" class="back-link">← Повернутись до Watch Party</a>
</div>

<script>
  // ===== ⚠️ ЗАМІНІТЬ НА ВАШ URL СЕРВЕРА =====
  const SERVER_URL = 'https://ваш-сервер.onrender.com/download';

  let currentVideoId = null;

  function getYoutubeId(url) {
    if (!url) return null;
    url = url.replace('music.youtube.com', 'youtube.com');
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([^&]+)/,
      /(?:youtu\.be\/)([^?]+)/,
      /(?:youtube\.com\/embed\/)([^?]+)/
    ];
    for (const pattern of patterns) {
      const match = url.match(pattern);
      if (match) return match[1];
    }
    return null;
  }

  // Завантаження відео в плеєр
  function loadVideo() {
    const url = document.getElementById('youtubeUrl').value.trim();
    const videoId = getYoutubeId(url);
    
    if (!videoId) {
      alert('❌ Невірне посилання на YouTube');
      return;
    }

    currentVideoId = videoId;
    const iframe = document.getElementById('youtubeIframe');
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
    document.getElementById('player').style.display = 'block';
    document.getElementById('downloadSection').style.display = 'block';
  }

  // Скачування MP3 через сервер
  async function downloadMP3() {
    const url = document.getElementById('youtubeUrl').value.trim();
    const videoId = getYoutubeId(url);
    
    if (!videoId) {
      showStatus('❌ Невірне посилання на YouTube', 'error');
      return;
    }

    const downloadBtn = document.getElementById('downloadBtn');
    const loader = document.getElementById('loader');
    const statusMsg = document.getElementById('statusMessage');

    downloadBtn.disabled = true;
    loader.style.display = 'block';
    statusMsg.textContent = '⏳ Конвертація відео в MP3...';
    statusMsg.className = 'status-message';

    try {
      const response = await fetch(`${SERVER_URL}?url=https://youtu.be/${videoId}`);
      
      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'Помилка конвертації');
      }

      // Створюємо посилання для скачування
      const blob = await response.blob();
      const downloadUrl = URL.createObjectURL(blob);
      
      // Отримуємо назву з заголовка
      const contentDisposition = response.headers.get('Content-Disposition');
      let filename = 'audio.mp3';
      if (contentDisposition) {
        const match = contentDisposition.match(/filename\*=UTF-8''(.+)/);
        if (match) {
          filename = decodeURIComponent(match[1]);
        }
      }

      // Скачуємо
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      // Очищаємо URL
      setTimeout(() => URL.revokeObjectURL(downloadUrl), 5000);

      showStatus('✅ MP3 успішно завантажено!', 'success');
    } catch (error) {
      console.error('Помилка:', error);
      showStatus(`❌ ${error.message || 'Помилка завантаження'}`, 'error');
    } finally {
      downloadBtn.disabled = false;
      loader.style.display = 'none';
    }
  }

  function showStatus(message, type) {
    const statusMsg = document.getElementById('statusMessage');
    statusMsg.textContent = message;
    statusMsg.className = `status-message ${type}`;
  }

  // ===== ТАБИ =====
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      
      if (this.dataset.tab === 'player') {
        document.getElementById('player').style.display = 'block';
        document.getElementById('downloadSection').style.display = 'none';
      } else {
        document.getElementById('player').style.display = 'none';
        document.getElementById('downloadSection').style.display = 'block';
      }
    });
  });

  // ===== ПОДІЇ =====
  document.getElementById('loadBtn').addEventListener('click', loadVideo);
  document.getElementById('downloadBtn').addEventListener('click', downloadMP3);
  document.getElementById('youtubeUrl').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') loadVideo();
  });

  // ===== АВТОЗАВАНТАЖЕННЯ =====
  window.onload = function() {
    setTimeout(loadVideo, 300);
  };
</script>

</body>
</html>
