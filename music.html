<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 YouTube MP3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 40px;
      max-width: 700px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #fff, #9b59b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 5px;
    }
    .subtitle {
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      margin-bottom: 25px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .input-group input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
      outline: none;
    }
    .input-group input:focus {
      border-color: #9b59b6;
    }
    .input-group input::placeholder {
      color: rgba(255,255,255,0.3);
    }
    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #9b59b6, #e74c3c);
      color: white;
      transition: 0.3s;
    }
    .btn:hover {
      transform: scale(1.03);
      box-shadow: 0 5px 20px rgba(155,89,182,0.4);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: 0.3s;
    }
    .tab-btn.active {
      background: rgba(155,89,182,0.25);
      border-color: #9b59b6;
      color: white;
    }
    #player {
      display: none;
      margin-top: 15px;
    }
    #player iframe {
      width: 100%;
      height: 200px;
      border-radius: 15px;
      border: none;
    }
    .download-section {
      display: none;
      margin-top: 15px;
      padding: 20px;
      background: rgba(46,204,113,0.08);
      border: 1px solid #2ecc71;
      border-radius: 15px;
    }
    .download-section h3 {
      color: #2ecc71;
      font-size: 1rem;
      margin-bottom: 15px;
    }
    .download-btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .download-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 5px 20px rgba(46,204,113,0.4);
    }
    .download-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .loader {
      display: none;
      margin: 15px 0;
    }
    .loader-spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #9b59b6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem;
      margin-top: 8px;
    }
    .info-box {
      background: rgba(155,89,182,0.08);
      border: 1px solid rgba(155,89,182,0.2);
      padding: 12px 16px;
      border-radius: 10px;
      margin: 15px 0;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
    }
    .info-box strong {
      color: #b380c9;
    }
    .back-link {
      display: block;
      margin-top: 25px;
      color: rgba(255,255,255,0.2);
      text-decoration: none;
      transition: 0.3s;
    }
    .back-link:hover {
      color: rgba(255,255,255,0.6);
    }
    .status-message {
      margin-top: 10px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
    }
    .status-message.success {
      color: #2ecc71;
    }
    .status-message.error {
      color: #e74c3c;
    }
    .status-message.info {
      color: #f1c40f;
    }
    @media (max-width: 480px) {
      .container { padding: 25px; }
      .input-group { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎵 YouTube MP3</h1>
  <p class="subtitle">Вставте посилання, слухайте та скачуйте</p>

  <div class="input-group">
    <input type="text" id="youtubeUrl" placeholder="https://youtube.com/watch?v=..." value="https://youtu.be/tMx3V5iVTnw">
    <button class="btn" id="loadBtn">▶ Завантажити</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="player">🎵 Плеєр</button>
    <button class="tab-btn" data-tab="download">⬇️ Скачати MP3</button>
  </div>

  <div id="player">
    <iframe id="youtubeIframe" allow="encrypted-media" allowfullscreen></iframe>
  </div>

  <div id="downloadSection" class="download-section">
    <h3>⬇️ Завантажити MP3</h3>
    <div class="loader" id="loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">⏳ Пошук MP3...</div>
    </div>
    <button class="download-btn" id="downloadBtn">🔊 Знайти та скачати</button>
    <div class="status-message" id="statusMessage"></div>
  </div>

  <div class="info-box">
    💡 <strong>Як це працює:</strong> Сайт пробує кілька безкоштовних API для пошуку MP3.<br>
    Якщо не вдається – використовуйте <strong>y2mate.is</strong> або <strong>loader.to</strong> (посилання нижче).
  </div>

  <div style="display:flex; gap:15px; justify-content:center; flex-wrap:wrap; margin-top:10px;">
    <a href="https://y2mate.is/" target="_blank" style="color:#9b59b6; text-decoration:none;">🔊 y2mate.is</a>
    <a href="https://loader.to/" target="_blank" style="color:#9b59b6; text-decoration:none;">🔊 loader.to</a>
  </div>

  <a href="index.html" class="back-link">← Повернутись до Watch Party</a>
</div>

<script>
  // ===== БЕЗКОШТОВНІ API ДЛЯ ПОШУКУ MP3 =====
  const APIS = [
    {
      name: 'vevioz',
      url: (id) => `https://api.vevioz.com/api/button/mp3/${id}`,
      parse: (data) => data.link && data.status === 'success' ? data.link : null
    },
    {
      name: 'savemp3',
      url: (id) => `https://savemp3.net/api/convert?url=https://youtube.com/watch?v=${id}`,
      parse: (data) => data.download_url || null
    },
    {
      name: 'ytmp3',
      url: (id) => `https://ytmp3.cc/api/convert?video_id=${id}`,
      parse: (data) => data.url || null
    }
  ];

  // ===== CORS-ПРОКСІ (для обходу блокувань) =====
  const PROXIES = [
    'https://cors-anywhere.herokuapp.com/',
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?'
  ];

  let currentVideoId = null;

  function getYoutubeId(url) {
    if (!url) return null;
    url = url.replace('music.youtube.com', 'youtube.com');
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([^&]+)/,
      /(?:youtu\.be\/)([^?]+)/,
      /(?:youtube\.com\/embed\/)([^?]+)/
    ];
    for (const pattern of patterns) {
      const match = url.match(pattern);
      if (match) return match[1];
    }
    return null;
  }

  function loadVideo() {
    const url = document.getElementById('youtubeUrl').value.trim();
    const videoId = getYoutubeId(url);
    
    if (!videoId) {
      alert('❌ Невірне посилання на YouTube');
      return;
    }

    currentVideoId = videoId;
    const iframe = document.getElementById('youtubeIframe');
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
    document.getElementById('player').style.display = 'block';
    document.getElementById('downloadSection').style.display = 'block';
  }

  // ===== ГОЛОВНА ФУНКЦІЯ ПОШУКУ MP3 =====
  async function findMP3() {
    const url = document.getElementById('youtubeUrl').value.trim();
    const videoId = getYoutubeId(url);
    
    if (!videoId) {
      showStatus('❌ Невірне посилання на YouTube', 'error');
      return;
    }

    const downloadBtn = document.getElementById('downloadBtn');
    const loader = document.getElementById('loader');
    const statusMsg = document.getElementById('statusMessage');

    downloadBtn.disabled = true;
    loader.style.display = 'block';
    showStatus('⏳ Пошук MP3... Спробуємо кілька джерел', 'info');

    // Пробуємо кожен API
    for (const api of APIS) {
      try {
        showStatus(`⏳ Спроба: ${api.name}...`, 'info');
        
        // Пробуємо напряму
        let response = await fetch(api.url(videoId), {
          signal: AbortSignal.timeout(8000)
        });
        
        // Якщо не вийшло – через проксі
        if (!response.ok) {
          for (const proxy of PROXIES) {
            try {
              response = await fetch(proxy + api.url(videoId), {
                signal: AbortSignal.timeout(10000)
              });
              if (response.ok) break;
            } catch (e) {}
          }
        }

        if (response.ok) {
          const data = await response.json();
          const link = api.parse(data);
          
          if (link && link.startsWith('http')) {
            // Знайшли MP3!
            window.open(link, '_blank');
            showStatus(`✅ MP3 знайдено! Завантаження через ${api.name}...`, 'success');
            loader.style.display = 'none';
            downloadBtn.disabled = false;
            return;
          }
        }
      } catch (error) {
        console.log(`API ${api.name} не відповів:`, error.message);
      }
    }

    // Якщо нічого не знайшли
    showStatus('❌ Не вдалося знайти MP3. Спробуйте y2mate.is або loader.to', 'error');
    loader.style.display = 'none';
    downloadBtn.disabled = false;
  }

  function showStatus(message, type) {
    const statusMsg = document.getElementById('statusMessage');
    statusMsg.textContent = message;
    statusMsg.className = `status-message ${type}`;
  }

  // ===== ТАБИ =====
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      
      if (this.dataset.tab === 'player') {
        document.getElementById('player').style.display = 'block';
        document.getElementById('downloadSection').style.display = 'none';
      } else {
        document.getElementById('player').style.display = 'none';
        document.getElementById('downloadSection').style.display = 'block';
      }
    });
  });

  // ===== ПОДІЇ =====
  document.getElementById('loadBtn').addEventListener('click', loadVideo);
  document.getElementById('downloadBtn').addEventListener('click', findMP3);
  document.getElementById('youtubeUrl').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') loadVideo();
  });

  // ===== АВТОЗАВАНТАЖЕННЯ =====
  window.onload = function() {
    setTimeout(loadVideo, 300);
  };
</script>

</body>
</html>
